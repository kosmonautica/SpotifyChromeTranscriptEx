<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spotify Transcript Copy settings</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 24px auto; }
    textarea { width: 100%; height: 300px; box-sizing: border-box; font: 13px ui-monospace, monospace; }
    code { background: #eee; padding: 1px 4px; }
  </style>
</head>
<body>
  <h1>Markdown template</h1>
  <p>Placeholders: <span id="placeholders"></span></p>
  <p>Filters: <code>{{date|wikilink}}</code> (Obsidian <code>[[link]]</code>), <code>{{show|default:"unknown"}}</code>. A line whose placeholders are all empty is left out.</p>
  <textarea id="template"></textarea>
  <p><button id="save">Save</button> <button id="reset">Reset to default</button> <button id="close">Close</button> <span id="status"></span></p>
  <script type="module" src="options.js"></script>
</body>
</html>
